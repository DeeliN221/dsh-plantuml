name: Release

# Tag-only release. Pushing an annotated tag v<major>.<minor>.<patch> builds the
# tarball and attaches it to a GitHub Release. This workflow never publishes to
# npm and needs no registry credentials: there is no NPM_TOKEN and no publish
# step.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve tag version and verify package.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' is not v<major>.<minor>.<patch>; this repo only releases plain SemVer tags."
            exit 1
          fi
          tag_version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag '$tag' does not match package.json version '$pkg_version'. Bump package.json, commit, merge to main, then tag that merge commit."
            exit 1
          fi
          echo "tag $tag matches package.json $pkg_version"

      - name: Verify bundled assets
        run: npm run verify

      - name: Package
        run: |
          set -euo pipefail
          npm pack
          sha256sum ./*.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -l ./*.tgz SHA256SUMS

      - name: Publish GitHub Release (no npm publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes \
            ./*.tgz SHA256SUMS
          install_note="安装：下载 dsh-plantuml-$VERSION.tgz 与 SHA256SUMS，先 sha256sum --check SHA256SUMS，再在 DSH 插件页安装该 tgz，或执行 dsh plugin --profile web add ./dsh-plantuml-$VERSION.tgz。Built from tag $TAG on commit $GITHUB_SHA；本工作流只创建 GitHub Release，不发布到 npm。"
          generated="$(gh release view "$TAG" --json body --jq .body)"
          notes="$(printf '%s\n\n%s\n' "$install_note" "$generated")"
          gh release edit "$TAG" --notes "$notes" --draft=false --prerelease=false --latest
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets --jq '{tag:.tagName,draft:.isDraft,prerelease:.isPrerelease,assets:[.assets[].name]}' | tee -a "$GITHUB_STEP_SUMMARY"
