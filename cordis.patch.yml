# dsh-plantuml bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the Web 插件 page or `dsh plugin add`, the profile appends
# this bundle to `dsh.profile.bundles` and the boot merges this single `insert`
# — one row mounting the package's host half (the `/dsh-plantuml` asset route)
# and its client half (the Markdown code-block renderer).
#
# A profile that still carries the old manual mount line
#
#   - insert:
#       - id: dsh-plantuml
#         name: 'dsh-plantuml'
#
# in its own cordis.patch.yml must drop it before switching to the bundle
# channel: two mounts register the same `/dsh-plantuml` prefix route twice and
# the whole plugin tree fails at boot ("duplicate prefix route").
- insert:
    - id: dsh-plantuml
      name: 'dsh-plantuml'
